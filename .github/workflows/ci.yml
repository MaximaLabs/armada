name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile
        run: |
          python -m py_compile bus/server.py node/wr_node.py cli/armada.py \
            tests/test_policy.py tests/test_bus_api.py
      - name: unit + integration tests
        run: |
          python tests/test_policy.py
          python tests/test_bus_api.py

  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build figures deterministically
        run: |
          node art/build.mjs
          node art/build.mjs --light
      - name: figures unchanged
        run: git diff --exit-code -- art/armada-flow.svg art/armada-flow-light.svg

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no real token files committed
        run: |
          ! git ls-files | grep -E '(^|/)(agents\.json|[^/]*\.env)$' \
            | grep -vE '\.example\.(json|env)$'
